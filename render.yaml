services:
  # FastAPI AI Service
  - type: web
    name: prsense-ai-service
    env: python
    rootDir: prsense-ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: prsense-db
          property: connectionString
      - key: BACKEND_URL
        fromService:
          name: prsense-backend
          type: web
          property: host

  # Spring Boot Backend
  - type: web
    name: prsense-backend
    env: docker
    rootDir: prsense-backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx384m
      - key: DATABASE_URL
        fromDatabase:
          name: prsense-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://prsense-ai.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          name: prsense-ai-service
          type: web
          property: host

databases:
  - name: prsense-db
    databaseName: prsense_db
    user: prsense_user
    plan: free
